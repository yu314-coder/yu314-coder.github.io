name: Build Trackformer1.1 history hindcasts

# Generates full-life Trackformer1.1 hindcasts for past storms and commits them, so the
# fetching happens here rather than on someone's laptop before a push.
#
# This is a backfill job, not a refresh: each run takes the next few
# not-yet-generated storms and stops. Re-run it to keep going -- --skip-existing
# makes it resume, and the index is written after every storm so a run that hits
# the time limit still lands the storms it finished.
#
# Cost is dominated by the analysis archive, and the two eras are very different:
#   CFSR  (to 2011-03-31)   4.6 MB per analysis -> ~220-410 MB per storm
#   CDAS  (from 2011-04-01)  4.3 MB per analysis -> about the same
# The CDAS era used to be 78 MB an analysis because only the 0.5 degree pressure
# file was being fetched; it also publishes a 2.5 degree analysis on the same
# grid as CFSR, so both halves now cost the same. Analyses are pruned after each
# storm to keep the runner's disk bounded.
#
# 8 a run, deliberately. This was briefly raised to 20, which is up to a
# thousand requests an hour against a public archive, and NCEI started
# refusing them with 403 -- from the runners, not from any one laptop. Eight a
# run with a pause between downloads is roughly 400 requests and ~2 GB, which
# is what it was doing happily before. Slower, and it finishes.
on:
  # Hourly. Both eras are now in scope: the CDAS half used to be excluded
  # because the only product being fetched was the 75 MB pressure file, ~1.3 TB
  # to cover 383 storms. It publishes a 4.3 MB low-resolution analysis on the
  # same 2.5-degree grid the CFSR era already uses, which brings the modern half
  # to the same cost as the old one. GitHub delivers these events best-effort
  # and in practice this fires about every four hours.
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      storms:
        description: "Space-separated IBTrACS ids. Leave blank to take the most intense ungenerated storms."
        required: false
        default: ""
      count:
        description: "How many ungenerated storms to take when `storms` is blank (use 1 for post-2011/CDAS storms)"
        required: false
        default: "8"
      era:
        description: "Which analysis source to draw from"
        required: false
        default: "all"
        type: choice
        options: ["all", "cfsr", "cdas"]

permissions:
  contents: write

concurrency:
  group: build-trackformer11-history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # the job cap is 360; leave room to commit
    steps:
      # The live-archive recovery below reads this repository's own git history,
      # and checkout is shallow by default -- it saw exactly one revision and
      # silently recovered nothing. blob:none keeps the full commit graph without
      # dragging down every blob in a 281 MB history; the few hundred versions of
      # the one file it reads are fetched on demand.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Free disk for the analysis cache
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h / | tail -1

      # The Trackformer1.0 norm stats/terrain this job needs are vendored under scripts/trackformer10
      # in THIS repo, so nothing Trackformer1.0-shaped is fetched here. What does come from
      # typhoon-predict is the Trackformer1.1 checkpoint bundle: three intensity,
      # three structure and three temporal experts plus their calibration, all in
      # one directory. They are Git LFS objects, hence lfs: true.
      #
      # Cache key bumped to v4 because the layout changed: typhoon-predict's
      # default branch dropped models/v23 and v37/ when it published Trackformer1.1,
      # so a v3 cache holds paths that no longer exist upstream.
      - name: Cache model weights
        id: cache-weights
        uses: actions/cache@v4
        with:
          path: typhoon-predict-models
          key: trackformer11-weights-v4

      # models/ is gone from the default branch -- typhoon-predict moved its
      # weights into release archives when it published 1.2 -- so the sparse
      # checkout this used to do resolves to nothing and the mv failed with
      # "cannot stat typhoon-predict-weights/models/trackformer_1_1". The
      # forecast job hit the same thing; this is the same fix.
      #
      # The path inside the archive is not hardcoded: the 1.2 asset was
      # repackaged mid-day and broke a hardcoded mv, so find the calibration
      # file wherever it lands and take the directory holding it.
      - name: Fetch weights
        if: steps.cache-weights.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ASSET="https://github.com/yu314-coder/typhoon-predict/releases/download/trackformer-1.1/trackformer_1_1.tar.gz"
          curl -fsSL --retry 3 --retry-delay 5 "$ASSET" -o /tmp/tf11.tar.gz
          rm -rf /tmp/tf11x && mkdir -p /tmp/tf11x typhoon-predict-models
          tar xzf /tmp/tf11.tar.gz -C /tmp/tf11x
          CAL=$(find /tmp/tf11x -name trackformer_1_1_calibration.json | head -1)
          if [ -z "$CAL" ]; then
            echo "::error::trackformer-1.1 release archive has no calibration file"
            find /tmp/tf11x -maxdepth 3 -type d | head -20
            exit 1
          fi
          mv "$(dirname "$CAL")" typhoon-predict-models/trackformer_1_1
          rm -rf /tmp/tf11.tar.gz /tmp/tf11x
          # A release archive carries real files rather than LFS pointers, but
          # keep the guard: it is cheap and it fails here with a clear reason
          # rather than 40 minutes later inside torch.load.
          for f in typhoon-predict-models/trackformer_1_1/*.pt; do
            sz=$(wc -c < "$f")
            if [ "$sz" -lt 1000000 ]; then
              echo "::error::$f is $sz bytes — LFS content did not download"
              exit 1
            fi
          done
          ls -la typhoon-predict-models/trackformer_1_1

      - name: Checkout Trackformer1.1 source modules
        uses: actions/checkout@v4
        with:
          repository: yu314-coder/typhoon-predict
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            trackformer_1_1_route.py
            trackformer_1_1_base_route.py
            trackformer_1_1_intensity.py
            trackformer_1_1_temporal.py
            analysis_level_mean_route.py
            scripts/predict_ibtracs_jma_only.py
          path: typhoon-predict-src

      # The calibration file names its structure/temporal checkpoint roots as
      # paths relative to the MODULE that loads them, so models/ has to sit beside
      # trackformer_1_1_intensity.py rather than anywhere else.
      - name: Link cached weights into the source tree
        run: |
          ln -sfn "$GITHUB_WORKSPACE/typhoon-predict-models" typhoon-predict-src/models
          test -f typhoon-predict-src/models/trackformer_1_1/trackformer_1_1_calibration.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-forecast.txt

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements-forecast.txt

      # The reanalysis this job needs is not published for the current season,
      # so recent storms would have nothing in history mode even though the live
      # job forecast them every 20 minutes and every forecast was committed.
      # Recover those before building, so a storm that had a route while it was
      # live keeps one afterwards. Cheap: it only reads this repository's own
      # git history, no network and no model.
      - name: Recover hindcasts from the live forecast archive
        run: python scripts/backfill_hindcasts_from_live.py

      - name: Generate hindcasts
        env:
          TF11_SRC_DIR: ${{ github.workspace }}/typhoon-predict-src
          TF11_ANALYSIS_DIR: /tmp/trackformer11-analysis
          MPLBACKEND: Agg
        run: |
          STORMS="${{ inputs.storms }}"
          COUNT="${{ inputs.count }}"; COUNT="${COUNT:-8}"
          ERA="${{ inputs.era }}"; ERA="${ERA:-all}"
          # Stop starting new storms well before the job cap so the commit step
          # still has time to run. The archive can be slow rather than refusing.
          export TF11_BUDGET_MIN=260
          # Exit 75 means the archive refused us: a known upstream condition with
          # nothing to fix here, so it becomes a warning and a green run rather
          # than the same red failure every hour. Any other non-zero is ours.
          set +e
          if [ -n "$STORMS" ]; then
            python scripts/build_trackformer11_history.py $STORMS --prune
          else
            python scripts/build_trackformer11_history.py --top "$COUNT" --era "$ERA" --skip-existing --prune
          fi
          rc=$?
          set -e
          if [ "$rc" -eq 75 ]; then
            echo "upstream refused; leaving this run green so the alert is not repeated" >> "$GITHUB_STEP_SUMMARY"
            rc=0
          fi
          df -h / | tail -1
          exit "$rc"

      - name: Commit generated hindcasts
        # always(): a run that hits the job timeout is killed mid-step, and
        # without this the commit never happens and every storm it did build is
        # thrown away. Six hours of downloads for nothing, which is exactly what
        # a slow archive was about to cause.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/typhoon-tracker/model/trackformer11 assets/typhoon-tracker/model/trackformer11-hindcasts.json
          if git diff --staged --quiet; then
            echo "nothing new generated"
            exit 0
          fi
          git commit -m "Add Trackformer1.1 history hindcasts"

          # Push, and if main moved under us, do NOT try to rebase the index.
          # It is a single line of JSON, so any two commits that touch it
          # conflict every time -- and three workflows commit to main on a
          # schedule, so that is routine rather than rare. One run built six
          # storms, including the first post-2011 ones, and lost all of them to
          # exactly this.
          #
          # There is nothing to reconcile anyway: every field in the index is
          # derived from the per-storm files. So take main's version of it,
          # keep our new storm files, and derive the index again.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "main moved; rebuilding the index on top of it (attempt $attempt)"
            git fetch origin main
            # --mixed, NOT --soft. --soft moves HEAD but leaves the index as
            # this runner built it, so the commit records that stale tree as
            # the new state and silently DELETES everything added to main since
            # this job checked out. It did exactly that: a run titled "Add Trackformer1.1
            # history hindcasts" removed the autopilot benchmark, its workflow,
            # five storm files, and reverted a trainer change. --mixed resets
            # the index to main and leaves our files in the working tree, so
            # the add below stages only ours.
            git reset --mixed origin/main
            git checkout origin/main -- assets/typhoon-tracker/model/trackformer11-hindcasts.json
            python scripts/rebuild_trackformer11_index.py
            git add assets/typhoon-tracker/model/trackformer11 assets/typhoon-tracker/model/trackformer11-hindcasts.json
            if git diff --staged --quiet; then
              echo "nothing left to add once main's work is included"
              exit 0
            fi
            git commit -m "Add Trackformer1.1 history hindcasts"
          done
          echo "::warning title=Could not push::main kept moving; the storms are built and will be picked up next run"
