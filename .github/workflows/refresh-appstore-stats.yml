name: Refresh App Store stats

# Snapshot Apple App Store download counts into static JSON that store-stats.html
# reads same-origin — same idea as the Microsoft Store and PyPI refreshers.
#
# Unlike the Microsoft one, this can genuinely run unattended: App Store Connect
# issues API keys straight from the developer account, with no Entra app
# registration in the way.
#
# Needs four repo secrets (Settings → Secrets and variables → Actions):
#   APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_PRIVATE_KEY, APPSTORE_VENDOR_NUMBER
# APPSTORE_PRIVATE_KEY is the whole .p8 file including the BEGIN/END lines.
# The key needs an Admin, Finance or Sales role — Developer gets a bare 403.
# Until they're set, the script is a graceful no-op, so this workflow stays green.
on:
  schedule:
    # Hourly, at 27 past.
    #
    # Apple only publishes once a day, so this is not about needing the data
    # sooner — it is about GitHub. Scheduled workflows here are best-effort:
    # the daily window for this job never fired once in 24 hours, and the PyPI
    # job routinely lands 40-60 minutes late. With one or two windows a day a
    # dropped run costs a whole day of numbers, silently. With 24 chances, a
    # missed hour is irrelevant.
    #
    # This only became reasonable once the scripts stopped rewriting files just
    # to move a timestamp: a run that finds nothing new now leaves every file
    # byte-identical and commits nothing. So the cost of an idle hour is one
    # API call per app, not a commit.
    #
    # Off the hour to avoid the :00 scheduling crush, which is when GitHub is
    # most likely to drop a run.
    - cron: "27 * * * *"

  # Cron alone does not work on this repo. Measured over 48 hours, GitHub
  # honoured 10 of 144 scheduled runs for the typhoon job, 8 of 24 for the data
  # job and 1 of 4 for PyPI — roughly a tenth of what was asked for, and this
  # job's own windows (06:57, 10:27, 11:27) were all dropped. Scheduled
  # workflows on free public repos are best-effort and this repo is clearly
  # being throttled.
  #
  # So ride along with whatever DOES get honoured. Every one of those workflows
  # that manages to start also starts this one, which turns the repo's handful
  # of surviving scheduled runs into the same handful of refresh opportunities.
  # Safe to fire often: a run that finds nothing new writes no file and commits
  # nothing.
  workflow_run:
    workflows:
      - "Refresh data"
      - "Refresh typhoon AI forecast"
      - "Refresh PyPI stats"
    types: [completed]

  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Reach back this many days (Apple keeps ~365). Blank = normal."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh-appstore-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyJWT (ES256 needs the cryptography extra)
        run: pip install --quiet "pyjwt[crypto]>=2.8"

      - name: Fetch App Store sales reports
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_VENDOR_NUMBER: ${{ secrets.APPSTORE_VENDOR_NUMBER }}
          APPSTORE_BACKFILL_DAYS: ${{ inputs.backfill_days }}
        run: python3 scripts/refresh_appstore_stats.py

      # Impressions and page views come from a different API than units — the
      # Analytics Reports one, which is a subscription rather than a query.
      # It no-ops harmlessly until Apple has generated the first report
      # (roughly 24-48h after the subscription is created), so it is safe to
      # run every night from the start.
      - name: Fetch App Store impressions and page views
        # Never let engagement trouble cost us the night's sales data: this step
        # runs AFTER the sales fetch but BEFORE the commit, so a hard failure
        # here would abort the job and drop units that were already downloaded.
        # The Analytics API is the newer, less predictable of the two.
        continue-on-error: true
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_VENDOR_NUMBER: ${{ secrets.APPSTORE_VENDOR_NUMBER }}
        run: python3 scripts/refresh_appstore_analytics.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The data directory does not exist until the first successful pull.
          # `git add` on a missing pathspec is a fatal error, so before the
          # secrets are set this step would fail the run — the opposite of the
          # graceful no-op the script goes to the trouble of providing.
          if [ ! -d assets/appstore-tracker/data ]; then
            echo "No App Store snapshots yet (script is a no-op until the four secrets are set)."
            exit 0
          fi
          git add assets/appstore-tracker/data
          if git diff --cached --quiet; then
            echo "No change in App Store snapshots."
          else
            git commit -m "chore: refresh App Store download snapshots"
            git push
          fi
