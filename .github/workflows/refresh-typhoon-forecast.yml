name: Refresh typhoon AI forecast

# Precomputes TrackFormer v23 (full 10-seed fp32 ensemble -- no int8 quantization, no seed
# subset) for every currently-active JMA tropical cyclone, so the browser can show a result
# instantly instead of downloading the ONNX model and running WASM inference itself. Every
# 30 minutes -- JMA reissues a few times a day, but this stays responsive to a storm's next
# real-world observation from Digital Typhoon. Also runnable on demand.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-typhoon-forecast
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The v23 checkpoints (~500MB, git-lfs) live in yu314-coder/typhoon-predict. Cached
      # under a fixed key so this doesn't re-pull ~500MB of LFS objects every 30 minutes --
      # bump the key (v1 -> v2) if the released model ever changes.
      - name: Cache v23 model weights
        id: cache-weights
        uses: actions/cache@v4
        with:
          path: typhoon-predict-models
          key: v23-weights-v1

      - name: Checkout typhoon-predict model weights
        if: steps.cache-weights.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: yu314-coder/typhoon-predict
          lfs: true
          sparse-checkout: models
          path: typhoon-predict-checkout

      - name: Move weights into cache path
        if: steps.cache-weights.outputs.cache-hit != 'true'
        run: |
          mkdir -p typhoon-predict-models
          mv typhoon-predict-checkout/models/* typhoon-predict-models/
          rm -rf typhoon-predict-checkout

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-forecast.txt

      - name: Install dependencies
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r scripts/requirements-forecast.txt

      - name: Run v23 forecast
        env:
          V23_MODELS_DIR: ${{ github.workspace }}/typhoon-predict-models
        run: python scripts/run_v23_forecast.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/typhoon-tracker/model/v23-live-forecast.json
          if git diff --staged --quiet; then
            echo "no change — nothing to commit"
            exit 0
          fi
          git commit -m "Refresh live typhoon AI forecast"
          # Coexist with the other scheduled commits on main.
          git pull --rebase --autostash origin main
          git push
