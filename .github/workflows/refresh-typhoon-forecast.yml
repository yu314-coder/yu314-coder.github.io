name: Refresh typhoon AI forecast

# Precomputes the live AI forecast server-side: the v62 causal western-Pacific
# route for the track, and the v23 10-seed fp32 ensemble for intensity and wind
# field (v62 has no intensity decoder). A storm whose v62 path cannot run
# causally -- GFS cycle not posted, track shorter than 24 h -- falls back to the
# v23 track and says so in the output.
#
# Two clocks matter here, and only one of them is the analysis clock.
#
# v62's inputs are 6-hourly GFS f000 analyses landing ~4 h after their cycle
# hour, so for *new atmospheric data* an hourly schedule is already generous
# and anything faster just re-downloads the same files from a free service.
#
# But the storm list is JMA's targetTc.json, and that changes whenever a
# depression is named -- the browser reads it live while this file is
# precomputed, so a storm that forms just after a run shows the overlay's
# "no forecast for it yet" until the next one.
#
# This asks for every 20 minutes and does not get it. Measured over 23
# scheduled runs: the gaps are 67 minutes at best, 139 median, 364 at worst,
# and not one of them was under 30. GitHub delivers cron events best-effort and
# throttles frequent ones, so the schedule here is a request, not a guarantee,
# and a newly named storm waits a couple of hours in practice rather than the
# twenty minutes this line reads as. Left as-is because a denser request does
# no harm and does occasionally land sooner, but do not trust the number: if
# the wait ever has to be bounded, it needs a trigger rather than a cron.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-typhoon-forecast
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The v23 seeds (~500 MB, git-lfs) that the fallback path still loads.
      #
      # DO NOT BUMP THIS KEY. typhoon-predict deleted models/v23 from its default
      # branch when it published Trackformer1.1, so the "Checkout weights" step
      # below can no longer fetch them -- this cache is the only surviving copy
      # the job can reach. A bump would evict it with nothing to restore from.
      # If these are ever needed again from scratch they must be re-published
      # upstream first.
      - name: Cache v23 weights
        id: cache-weights
        uses: actions/cache@v4
        with:
          path: typhoon-predict-models
          key: v62-weights-v3

      - name: Checkout weights
        if: steps.cache-weights.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: yu314-coder/typhoon-predict
          lfs: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            models/v23
          path: typhoon-predict-weights

      - name: Move weights into cache path
        if: steps.cache-weights.outputs.cache-hit != 'true'
        run: |
          mkdir -p typhoon-predict-models/v23
          if [ -d typhoon-predict-weights/models/v23 ]; then
            mv typhoon-predict-weights/models/v23/* typhoon-predict-models/v23/
          else
            echo "::warning::models/v23 is no longer published upstream and the cache missed;" \
                 "the v23 fallback will be unavailable this run"
          fi
          rm -rf typhoon-predict-weights

      # Trackformer1.1's checkpoint bundle, cached separately so it can be
      # re-fetched without touching the v23 cache above.
      - name: Cache Trackformer1.1 weights
        id: cache-tf11
        uses: actions/cache@v4
        with:
          path: typhoon-predict-tf11
          key: trackformer11-weights-v1

      - name: Checkout Trackformer1.1 weights
        if: steps.cache-tf11.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: yu314-coder/typhoon-predict
          lfs: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            models/trackformer_1_1
          path: typhoon-predict-tf11-src

      - name: Move Trackformer1.1 weights into cache path
        if: steps.cache-tf11.outputs.cache-hit != 'true'
        run: |
          mkdir -p typhoon-predict-tf11
          mv typhoon-predict-tf11-src/models/trackformer_1_1 typhoon-predict-tf11/
          rm -rf typhoon-predict-tf11-src
          # A pointer is ~130 bytes, a checkpoint ~8.5 MB. Fail here with a clear
          # reason rather than inside torch.load.
          for f in typhoon-predict-tf11/trackformer_1_1/*.pt; do
            sz=$(wc -c < "$f")
            if [ "$sz" -lt 1000000 ]; then
              echo "::error::$f is $sz bytes — LFS content did not download"
              exit 1
            fi
          done

      # The source modules are small and always taken fresh, so a change upstream
      # is picked up without a cache bump.
      - name: Checkout Trackformer1.1 source modules
        uses: actions/checkout@v4
        with:
          repository: yu314-coder/typhoon-predict
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            trackformer_1_1_route.py
            trackformer_1_1_base_route.py
            trackformer_1_1_intensity.py
            trackformer_1_1_temporal.py
            analysis_level_mean_route.py
            scripts/predict_ibtracs_jma_only.py
          path: typhoon-predict-src

      # The calibration names its structure/temporal roots relative to the MODULE
      # that loads them, so models/ has to sit beside trackformer_1_1_intensity.py.
      - name: Link cached weights into the source tree
        run: |
          ln -sfn "$GITHUB_WORKSPACE/typhoon-predict-tf11" typhoon-predict-src/models
          test -f typhoon-predict-src/models/trackformer_1_1/trackformer_1_1_calibration.json

      # GFS analysis GRIBs, reused across runs so a free public service isn't
      # asked for the same cycle every hour. restore-keys picks up the newest
      # previous cache; old cycles are pruned below.
      - name: Cache GFS analysis files
        uses: actions/cache@v4
        with:
          path: /tmp/v62-grib
          key: v62-grib-${{ github.run_id }}
          restore-keys: v62-grib-

      - name: Prune GFS cache older than 3 days
        run: |
          mkdir -p /tmp/v62-grib
          find /tmp/v62-grib -name '*.grib2' -mtime +3 -delete || true
          echo "cached cycles: $(ls -1 /tmp/v62-grib 2>/dev/null | wc -l)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-forecast.txt

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements-forecast.txt

      - name: Run v62 + v23 forecast
        env:
          V23_MODELS_DIR: ${{ github.workspace }}/typhoon-predict-models/v23
          V62_SRC_DIR: ${{ github.workspace }}/typhoon-predict-src
          V62_GRIB_DIR: /tmp/v62-grib
          MPLBACKEND: Agg
        run: python scripts/run_v62_forecast.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/typhoon-tracker/model/v23-live-forecast.json
          if git diff --staged --quiet; then
            echo "no change — nothing to commit"
            exit 0
          fi
          git commit -m "Refresh live typhoon AI forecast"

          # Do not rebase this file. It is regenerated whole from JMA and the
          # GFS analysis on every run, so two runs that overlap conflict on it
          # every time -- and with several scheduled jobs committing to main
          # that is routine rather than rare.
          #
          # There is also nothing to reconcile: our copy was computed from a
          # later analysis than whatever landed while we were working, so it is
          # strictly the better one. Replay it on top of main instead of trying
          # to merge two full regenerations line by line.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "main moved; replaying this forecast on top of it (attempt $attempt)"
            git fetch origin main
            # --mixed, NOT --soft. --soft moves HEAD but leaves the index as
            # this runner built it, so committing records that stale tree as
            # the new state and silently DELETES everything added to main since
            # this job checked out. It did exactly that once: a backfill run
            # removed the autopilot benchmark, its workflow, five storm files
            # and reverted a trainer change, all in a commit titled "Add v62
            # history hindcasts". --mixed resets the index to main and leaves
            # our files in the working tree, so the next add stages only ours.
            git reset --mixed origin/main
            git add assets/typhoon-tracker/model/v23-live-forecast.json
            if git diff --staged --quiet; then
              echo "main already has an equivalent forecast"
              exit 0
            fi
            git commit -m "Refresh live typhoon AI forecast"
          done
          echo "::warning title=Could not push::main kept moving; the next run refreshes it anyway"
