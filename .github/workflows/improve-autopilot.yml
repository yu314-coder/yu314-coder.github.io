name: Improve autopilot (Claude)

# Claude proposes one change to the breakout autopilot, and the change only
# survives if the bot actually plays better afterwards.
#
# The measurement is the point, not the model. Everything interesting about this
# autopilot has been decided by playing it rather than by reasoning about it,
# and every idea that sounded right and lost did so by a clear margin:
#
#   a seam-router that aimed every return at a gap        measured worse
#   clamping the target to what the bat could reach       hard fell 10 -> 7
#   shrinking reachability slack as the ball speeds up    best value was zero
#   two full RL runs over a 284-weight conv policy        neither beat the
#                                                         hand-written heuristic
#
# So this workflow is built to reject its own output by default. It benchmarks
# before, lets Claude edit only assets/js/main.js, benchmarks after, and opens a
# PR only if the suite still passes and play improved by a real margin. It never
# pushes to main: a human reads the diff and the numbers.
#
# Needs ANTHROPIC_API_KEY in repository secrets. Without it the job says so and
# stops rather than failing noisily on a schedule.
on:
  workflow_dispatch:
    inputs:
      focus:
        description: "What to try to improve (free text, given to Claude verbatim)"
        required: false
        default: "Find one concrete weakness in the breakout autopilot and fix it."
      runs:
        description: "Benchmark runs per row — higher is slower and less noisy"
        default: "11"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: improve-autopilot
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stop early if there is no key
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "ANTHROPIC_API_KEY is not set, so there is nothing to run." >> "$GITHUB_STEP_SUMMARY"
            echo "Add it in Settings > Secrets and variables > Actions." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: The rules must hold before touching anything
        run: node tests/arcade.test.js

      - name: Measure how it plays now
        run: |
          RUNS="${{ inputs.runs }}"; RUNS="${RUNS:-11}"
          node tests/bench-autopilot.js --runs "$RUNS" | tee before.log
          cp before.log /tmp/before.log

      - name: Let Claude try one change
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            ${{ inputs.focus }}

            The autopilot lives in assets/js/main.js, in the Breakout object:
            autoPlay, aimGoal, plannedShot, scoreShot, predictX, bestCapsule,
            dodge, tunnelGoal, seamAim, beamClamp and threats.

            Rules for this task, which matter more than the change itself:

            1. Edit ONLY assets/js/main.js. Do not touch the tests, the
               benchmark, or any workflow -- a change that edits its own marking
               scheme is worthless.
            2. Make ONE focused change. A large diff cannot be attributed to a
               measurement.
            3. `node tests/arcade.test.js` must still pass. Run it.
            4. Measure with `node tests/bench-autopilot.js --runs 7` before and
               after. If it does not improve, say so plainly and revert your
               change with `git checkout -- assets/js/main.js`. Reverting is a
               perfectly good outcome and is what most ideas here deserve.
            5. Do not tune the difficulty tiers to flatter the bot. The bot has
               to get better at the game; the game does not get easier.

            Ideas that were tried and measured worse are recorded in the
            comments around those functions. Read them before proposing
            something -- repeating one of them wastes the run.

      - name: Measure how it plays after
        id: after
        run: |
          RUNS="${{ inputs.runs }}"; RUNS="${RUNS:-11}"
          set +e
          node tests/arcade.test.js > tests.log 2>&1
          echo "tests=$?" >> "$GITHUB_OUTPUT"
          node tests/bench-autopilot.js --runs "$RUNS" | tee after.log
          echo "bench=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e
          if git diff --quiet -- assets/js/main.js; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide, and open a PR only if it is genuinely better
        run: |
          {
            echo '### Before'; echo '```'; sed -n '/board  /,$p' /tmp/before.log; echo '```'
            echo '### After';  echo '```'; sed -n '/board  /,$p' after.log;      echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.after.outputs.changed }}" = "no" ]; then
            echo 'Claude made no change, or reverted its own. Nothing to propose.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ steps.after.outputs.tests }}" != "0" ]; then
            echo 'The suite fails with the change. Discarded.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${{ steps.after.outputs.bench }}" != "0" ]; then
            echo 'Play fell below the floor with the change. Discarded.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Total median score across every row, before and after. A blunt
          # number on purpose: per-row medians of a stochastic player wander,
          # and a 3% bar over eight rows is harder to reach by luck than any
          # single row is.
          B=$(awk '/^  (ordinary|indestructible)/ {s+=$4} END {print s+0}' /tmp/before.log)
          A=$(awk '/^  (ordinary|indestructible)/ {s+=$4} END {print s+0}' after.log)
          echo "total median score: $B -> $A" >> "$GITHUB_STEP_SUMMARY"
          if [ "$A" -le $(( B * 103 / 100 )) ]; then
            echo 'Not a clear enough improvement (needs +3%). Discarded, as most ideas here are.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BR="autopilot/claude-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add assets/js/main.js
          git commit \
            -m "Autopilot: total median score $B -> $A" \
            -m "Proposed by the improve-autopilot workflow and kept only because it measured better across all eight benchmark rows. Suite passes. Read the diff before merging: the benchmark says it plays better, not that the reasoning is sound."
          git push origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "Autopilot: total median score $B -> $A" \
            --body "Automated proposal. Benchmarked before and after on the same runner; suite green; improvement above the 3% bar. Numbers are in the run summary. This is a suggestion, not a verdict -- the diff still needs reading."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
