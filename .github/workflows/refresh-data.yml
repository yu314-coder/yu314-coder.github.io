name: Refresh data

# Keeps the price data embedded in index.html current, so the offline fallback
# isn't stale between visits. The page still refreshes live in the browser; this
# just backstops it. Every 2 hours on weekdays — quiet markets don't change the
# blob, so no commit happens outside trading hours. Also runnable on demand.
on:
  schedule:
    - cron: "5 */2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch quotes and rewrite the embedded blob
        run: python scripts/refresh_embedded.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "no change — nothing to commit"
            exit 0
          fi
          git commit -m "Refresh embedded quotes"

          # Replay rather than rebase. Everything staged here is regenerated
          # whole on each run, so two overlapping runs conflict on it every
          # time and there is nothing to reconcile line by line -- ours is
          # simply the newer generation.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "main moved; replaying on top of it (attempt $attempt)"
            git fetch origin main
            # --mixed, NOT --soft. --soft moves HEAD but leaves the index as
            # this runner built it, so committing records that stale tree as
            # the new state and silently DELETES everything added to main since
            # this job checked out. It did exactly that once: a backfill run
            # removed the autopilot benchmark, its workflow, five storm files
            # and reverted a trainer change, all in a commit titled "Add v62
            # history hindcasts". --mixed resets the index to main and leaves
            # our files in the working tree, so the next add stages only ours.
            git reset --mixed origin/main
            git add -A
            if git diff --staged --quiet; then
              echo "main already has an equivalent version"
              exit 0
            fi
            git commit -m "Refresh embedded quotes"
          done
          echo "::warning title=Could not push::main kept moving; the next run redoes this"
