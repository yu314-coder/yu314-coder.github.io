name: Refresh PyPI stats

# Snapshot pypistats.org daily downloads for the tracked packages into static
# JSON the PyPI-stats page reads same-origin — so the chart shows fresh data with
# no runtime CORS proxy. Runs daily; can also be triggered by hand.
on:
  schedule:
    # Two windows, twelve hours apart — scheduled runs on this repo land
    # 40-60 minutes late and are occasionally dropped. The snapshot is
    # idempotent, so the backup costs nothing when the first one ran.
    - cron: "17 6 * * *"  # ~06:17 UTC
    - cron: "17 18 * * *" # ~18:17 UTC backup
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-pypi-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pypistats snapshots
        run: python3 scripts/refresh_pypistats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pypi-tracker/data
          if git diff --cached --quiet; then
            echo "No change in pypistats snapshots."
            exit 0
          fi
          git commit -m "chore: refresh pypistats snapshots"

          # main moves under this job. Several scheduled workflows commit to
          # this repo, so a run that checks out, works, then pushes can find
          # main already advanced and be rejected non-fast-forward. The App
          # Store job hit exactly that on 2026-09-02.
          #
          # Two of these cannot overlap (the concurrency group queues them), so
          # whatever landed touched other paths and replaying ours loses nothing.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "main moved; replaying on top of it (attempt $attempt)"
            git fetch origin main
            # --mixed, NOT --soft. --soft moves HEAD but keeps the index this
            # runner built, so the next commit records a tree that predates
            # whatever landed on main and silently deletes it. That happened
            # once in this repo already; see refresh-typhoon-forecast.yml.
            git reset --mixed origin/main
            git add assets/pypi-tracker/data
            if git diff --staged --quiet; then
              echo "main already has this"
              exit 0
            fi
            git commit -m "chore: refresh pypistats snapshots"
          done
          echo "::warning title=Could not push::main kept moving; the next run refreshes it anyway"
