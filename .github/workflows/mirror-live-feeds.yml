name: Mirror live storm feeds

# Copies the two live feeds the typhoon tracker can't read from a browser --
# JTWC's b-deck (via UCAR/RAL) and the CIMSS ADT Dvorak history -- into
# assets/data/typhoons/live/feeds.json for the western-Pacific storms that are
# active now. Neither source sends a CORS header, and the public CORS proxies
# the tracker used to go through have all stopped answering.
#
# It also maps the Trackformer Weather Lab's ids for storms it filed under
# JMA's TC number (TC2634) to the IBTrACS ids the tracker uses (2026278N11168),
# so the history view finds their runs. One small catalog request per run; a
# new id costs up to three forecast reads, once.
#
# And it copies NCDR's official forecasts (CWA, JTWC, JMA, KMA, CMA, HKO) with
# CWA's track into live/official.json and assets/data/typhoons/official/, so
# live mode can draw them and the history view can replay them later.
#
# Asks for every 30 minutes; GitHub delivers frequent schedules late (see
# refresh-typhoon-forecast.yml: 67 minutes at best), so expect roughly hourly.
# The b-deck itself only moves every 6 hours. Nothing in the file is a clock of
# the run, so a quiet run commits nothing, and with no storm active the file
# empties once and then stays put.
on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-live-feeds
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the b-decks and CIMSS histories
        run: python scripts/mirror_live_feeds.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          F="assets/data/typhoons/live assets/data/typhoons/official"
          git add $F
          if git diff --staged --quiet; then
            echo "no change — nothing to commit"
            exit 0
          fi
          git commit -m "Mirror live storm feeds"

          # feeds.json is regenerated whole each run, so it is replayed on main
          # as it is (see refresh-typhoon-forecast.yml). The official/ files
          # accumulate every issue NCDR has shown, so they are merged again on
          # top of main's copies instead: replaying this runner's older ones
          # could drop issues a newer commit (a backfill) had added.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "main moved; replaying on top of it (attempt $attempt)"
            cp assets/data/typhoons/live/feeds.json "$RUNNER_TEMP/feeds.json"
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/feeds.json" assets/data/typhoons/live/feeds.json
            python scripts/mirror_live_feeds.py --official-only
            git add $F
            if git diff --staged --quiet; then
              echo "main already has these feeds"
              exit 0
            fi
            git commit -m "Mirror live storm feeds"
          done
          echo "::warning title=Could not push::main kept moving; the next run redoes this"
