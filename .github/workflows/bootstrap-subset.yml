name: Rebuild CSS

# The pages link built CSS (scripts/build_css.sh): bootstrap.site.min.css, the part of
# Bootstrap they use, and style.min.css, assets/css/style.css minified, with a content-hash
# token on its links. A page edit that starts using a Bootstrap class missing from the
# subset would render unstyled, and an edit to style.css would not reach the site, so
# every push that touches a page, a script or a stylesheet rebuilds both and commits
# what changed.
on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "assets/js/**"
      - "assets/*-tracker/**.js"
      - "assets/*-tracker/*.html"
      - "assets/css/style.css"
      - "assets/vendor/bootstrap-5.3.3/**"
      - "scripts/purgecss.bootstrap.cjs"
      - "scripts/build_css.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-subset
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild and commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          F="assets/vendor/bootstrap-5.3.3/bootstrap.site.min.css assets/css/style.min.css *.html"
          for attempt in 1 2 3; do
            bash scripts/build_css.sh
            git add $F
            if git diff --cached --quiet; then
              echo "CSS is current."
              exit 0
            fi
            git commit -m "chore: rebuild CSS"
            if git push; then
              exit 0
            fi
            # Scheduled data jobs commit to main too; rebuild on top of theirs.
            echo "main moved; rebuilding on top of it (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main
          done
          echo "::warning title=Could not push::main kept moving; the next push rebuilds it anyway"
