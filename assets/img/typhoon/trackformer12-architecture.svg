<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="400" viewBox="0 0 1260 400" role="img" aria-labelledby="title desc">
  <title id="title">Trackformer 1.2 pressure-first forecasting</title>
  <desc id="desc">Nine causal analyses initialize coupled basin and moving-core evolution. Their physical pressure composite yields the storm centre and central pressure. Recurrent evolution advances twenty six-hour steps.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#50637d"/></marker></defs>
  <rect width="1260" height="400" rx="20" fill="#f6f8fc"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#19283d">
    <text x="42" y="48" font-size="25" font-weight="700">Trackformer 1.2 · pressure-first forecasting</text>
    <text x="42" y="77" font-size="16" fill="#57677d">Causal weather history → coupled spatial evolution → storm readout</text>
    <rect x="42" y="146" width="245" height="130" rx="14" fill="#fff" stroke="#cbd5e4"/>
    <text x="62" y="179" font-size="19" font-weight="700">Issue-time initialization</text>
    <text x="62" y="210" font-size="16">9 analyses · −48 to 0 h</text>
    <text x="62" y="235" font-size="16">Geography, motion, intensity</text>
    <text x="62" y="259" font-size="14" fill="#57677d">Missing native detail stays masked</text>
    <rect x="356" y="110" width="295" height="100" rx="14" fill="#e8f0ff" stroke="#90b2df"/>
    <text x="376" y="144" font-size="19" font-weight="700">Basin pressure + memory</text>
    <text x="376" y="172" font-size="16">Steering advection + tendencies</text>
    <text x="376" y="195" font-size="15">Multiscale environmental attention</text>
    <rect x="356" y="238" width="295" height="90" rx="14" fill="#e5f5ef" stroke="#8ccbb1"/>
    <text x="376" y="271" font-size="19" font-weight="700">Moving pressure core</text>
    <text x="376" y="298" font-size="16">Transport + learned anomaly update</text>
    <rect x="721" y="146" width="216" height="130" rx="14" fill="#fff" stroke="#cbd5e4"/>
    <text x="740" y="180" font-size="19" font-weight="700">Physical pressure</text>
    <text x="740" y="211" font-size="16">Basin + tapered core</text>
    <text x="740" y="238" font-size="16">MSLP fields in hPa</text>
    <rect x="1000" y="146" width="218" height="130" rx="14" fill="#edf2ff" stroke="#a5b6df"/>
    <text x="1020" y="180" font-size="19" font-weight="700">Pressure readout</text>
    <text x="1020" y="211" font-size="16">Storm centre → route</text>
    <text x="1020" y="238" font-size="16">Central pressure</text>
    <text x="660" y="371" text-anchor="middle" font-size="16" fill="#57677d">Recurrent rollout: +6, +12, …, +120 h · future observations are never inputs</text>
  </g>
  <g stroke="#50637d" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <path d="M287 190 H319 V160 H351"/><path d="M287 230 H319 V283 H351"/>
    <path d="M503 211 V233"/><path d="M651 160 H681 V183 H716"/>
    <path d="M651 283 H681 V239 H716"/><path d="M937 211 H995"/>
    <path d="M829 277 V344 H330 V282" stroke-dasharray="6 5"/>
  </g>
</svg>
